["rust:fmt"]
description = "Apply rustfmt to the complete Cargo workspace"
env = { FYAGENT_TASK_EFFECT = "source-modifying" }
run = "cargo fmt --all --manifest-path src-tauri/Cargo.toml"

["rust:fmt:check"]
description = "Verify rustfmt for the complete Cargo workspace"
env = { FYAGENT_TASK_EFFECT = "read-only" }
run = "cargo fmt --all --check --manifest-path src-tauri/Cargo.toml"

["rust:check"]
description = "Run locked Cargo check for every target kind on the current host"
env = { FYAGENT_TASK_EFFECT = "read-only", FYAGENT_WINDOWS_MANIFEST = "test" }
run = "node scripts/tasks/rust.mjs check"

["rust:clippy"]
description = "Run locked current-host Clippy for the workspace and deny every warning"
env = { FYAGENT_TASK_EFFECT = "read-only", FYAGENT_WINDOWS_MANIFEST = "test" }
run = "node scripts/tasks/rust.mjs clippy"

["rust:test"]
description = "Run locked current-host Cargo tests with optional controlled filters"
usage = '''
arg "[filters]" var=#true help="Cargo test name filters"
'''
env = { FYAGENT_TASK_EFFECT = "read-only", FYAGENT_WINDOWS_MANIFEST = "test" }
run = "node scripts/tasks/rust.mjs test"
