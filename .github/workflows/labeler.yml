name: Label PRs

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to label"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-24.04
    steps:
      # With no checkout, Labeler fetches this configuration through the API at
      # github.context.sha, which is the trusted base SHA for pull_request_target.
      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          sync-labels: true
          dot: true
