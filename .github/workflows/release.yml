name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  version-contract:
    name: Freeze version and source contract
    runs-on: ubuntu-22.04
    outputs:
      app_version: ${{ steps.contract.outputs.app_version }}
      release_tag: ${{ steps.contract.outputs.release_tag }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Validate and freeze release contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          pnpm run version:check
          app_version="$(pnpm --silent run version:get)"
          release_tag="v${app_version}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pnpm run version:check -- --tag "${GITHUB_REF_NAME}"
            if [ "${GITHUB_REF_NAME}" != "$release_tag" ]; then
              echo "Release tag must exactly match ${release_tag}; got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          printf 'app_version=%s\n' "$app_version" >> "$GITHUB_OUTPUT"
          printf 'release_tag=%s\n' "$release_tag" >> "$GITHUB_OUTPUT"
          printf 'source_sha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'branch')
    needs: version-contract
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      APP_VERSION: ${{ needs.version-contract.outputs.app_version }}
      RELEASE_TAG: ${{ needs.version-contract.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.version-contract.outputs.source_sha }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.ref_type == 'tag' && '{"include":[{"os":"windows-2022"},{"os":"windows-11-arm","arch":"arm64"},{"os":"ubuntu-22.04"},{"os":"ubuntu-22.04-arm","arch":"arm64"},{"os":"macos-14"}]}' || '{"include":[{"os":"macos-14"}]}') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Windows ARM64 target
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: rustup target add aarch64-pc-windows-msvc

      - name: Add macOS targets
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          # Core build tools and pkg-config
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            curl \
            wget \
            file \
            patchelf \
            libssl-dev \
            rpm \
            flatpak \
            flatpak-builder \
            elfutils \
            xdg-utils
          # GTK/GLib stack for gdk-3.0, glib-2.0, gio-2.0
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev
          # WebKit2GTK (version differs across Ubuntu images; try 4.1 then 4.0)
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          # libsoup also changed major version; prefer 3.0 with fallback to 2.4
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Get pnpm store directory
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        if: runner.os != 'Windows' || matrix.arch != 'arm64'
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pnpm-store-

      - name: Setup LLVM for Windows ARM64
        if: runner.os == 'Windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llvmRoot = 'C:\Program Files\LLVM'
          if (-not (Test-Path $llvmRoot)) {
            throw "LLVM not found at $llvmRoot"
          }
          $llvmBin = Join-Path $llvmRoot 'bin'
          "LIBCLANG_PATH=$llvmBin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CLANG_PATH=$(Join-Path $llvmBin 'clang.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Verify checked-out version contract
        shell: bash
        run: |
          set -euo pipefail
          [ "$RELEASE_TAG" = "v$APP_VERSION" ]
          [ "$SOURCE_SHA" = "$GITHUB_SHA" ]
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            pnpm run version:check -- --tag "$RELEASE_TAG"
          else
            pnpm run version:check
          fi

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          # Decode .p12 certificate from base64
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "${{ secrets.APPLE_CERTIFICATE }}" | (base64 --decode 2>/dev/null || base64 -D) > "$CERT_PATH"

          # Save original default keychain for cleanup
          ORIGINAL_DEFAULT_KEYCHAIN=$(security default-keychain -d user | tr -d '"' | xargs)
          echo "ORIGINAL_DEFAULT_KEYCHAIN=$ORIGINAL_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"

          # Create temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          # Import certificate
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          # Dynamically resolve signing identity (must be "Developer ID Application")
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          if [ -z "$IDENTITY" ]; then
            echo "❌ No 'Developer ID Application' identity found — listing all identities:" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "✅ Signing identity: $IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          # Cleanup certificate file
          rm -f "$CERT_PATH"

      - name: Build Tauri App (macOS)
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        timeout-minutes: 60
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== macOS build/notarization attempt ${attempt}/${max_attempts} ==="
            if pnpm tauri build --target universal-apple-darwin; then
              echo "✅ macOS build/notarization succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ macOS build/notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build/notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Build unsigned Tauri App (macOS branch)
        if: runner.os == 'macOS' && github.ref_type != 'tag'
        shell: bash
        timeout-minutes: 60
        run: |
          set -euo pipefail
          pnpm tauri build --target universal-apple-darwin --bundles app
          echo "Unsigned macOS branch app build succeeded; no signing or notarization was requested."

      - name: Verify macOS embedded application version
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              APP_PATH="$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)"
              [ -n "$APP_PATH" ] && break
            fi
          done
          [ -n "$APP_PATH" ] || { echo "No macOS app found for version verification" >&2; exit 1; }
          BUNDLE_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")"
          [ "$BUNDLE_VERSION" = "$APP_VERSION" ] || {
            echo "CFBundleShortVersionString $BUNDLE_VERSION does not match APP_VERSION $APP_VERSION" >&2
            exit 1
          }

      - name: Build Tauri App (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
          FYAGENT_WINDOWS_MANIFEST: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri build --target aarch64-pc-windows-msvc --no-bundle
          } else {
            pnpm tauri build --no-bundle
          }

      - name: Verify embedded Windows release manifest before EXE signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $exePath = Join-Path $targetRoot 'fyagent.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Windows release executable not found: $exePath"
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($exePath)
          if ([string]::IsNullOrWhiteSpace($versionInfo.ProductVersion) -or
              -not $versionInfo.ProductVersion.StartsWith($env:APP_VERSION, [StringComparison]::Ordinal)) {
            throw "Windows executable ProductVersion does not match frozen APP_VERSION $env:APP_VERSION: $($versionInfo.ProductVersion)"
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP 'fyagent-release-before-exe-sign.manifest'
          Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
          Get-Command mt.exe -ErrorAction Stop | Out-Null
          # mt.exe only reads the PE RT_MANIFEST resource; it never runs fyagent.exe.
          & mt.exe "-inputresource:$exePath;#1" "-out:$manifestPath" -nologo
          if ($LASTEXITCODE -ne 0) {
            throw "mt.exe failed to extract RT_MANIFEST from $exePath before executable signing"
          }
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "mt.exe did not write the extracted RT_MANIFEST: $manifestPath"
          }

          $manifest = [System.Xml.XmlDocument]::new()
          try {
            $manifest.Load($manifestPath)
          } catch {
            throw "Extracted RT_MANIFEST is not valid XML: $($_.Exception.Message)"
          }
          $requestedExecutionLevels = @(
            $manifest.SelectNodes("//*[local-name()='requestedExecutionLevel']")
          )
          if ($requestedExecutionLevels.Count -ne 1) {
            throw "Embedded RT_MANIFEST must contain exactly one requestedExecutionLevel; found $($requestedExecutionLevels.Count)"
          }
          [System.Xml.XmlElement]$requestedExecutionLevel = $requestedExecutionLevels[0]
          if (
            $requestedExecutionLevel.NamespaceURI -cne 'urn:schemas-microsoft-com:asm.v3' -or
            $requestedExecutionLevel.Attributes.Count -ne 2 -or
            -not $requestedExecutionLevel.HasAttribute('level') -or
            -not $requestedExecutionLevel.HasAttribute('uiAccess') -or
            $requestedExecutionLevel.GetAttribute('level') -cne 'requireAdministrator' -or
            $requestedExecutionLevel.GetAttribute('uiAccess') -cne 'false'
          ) {
            throw 'Embedded RT_MANIFEST must contain exactly one requestedExecutionLevel level="requireAdministrator" uiAccess="false"'
          }

      - name: Build and verify Windows installer-actions DLL
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installerActionsTarget = Join-Path $PWD 'src-tauri/target/installer-actions'
          $env:CARGO_TARGET_DIR = $installerActionsTarget
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            cargo build --locked --manifest-path src-tauri/Cargo.toml --package fyagent-installer-actions --target aarch64-pc-windows-msvc --release
            $dllPath = Join-Path $installerActionsTarget 'aarch64-pc-windows-msvc/release/fyagent_installer_actions.dll'
            [uint16]$expectedMachine = 0xAA64
            $expectedMachineName = 'ARM64'
          } else {
            cargo build --locked --manifest-path src-tauri/Cargo.toml --package fyagent-installer-actions --release
            $dllPath = Join-Path $installerActionsTarget 'release/fyagent_installer_actions.dll'
            [uint16]$expectedMachine = 0x8664
            $expectedMachineName = 'x64'
          }

          $dll = Get-Item -LiteralPath $dllPath -ErrorAction Stop
          $bytes = [IO.File]::ReadAllBytes($dll.FullName)
          if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw "installer-actions output is not a PE DLL: $($dll.FullName)"
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0x40 -or $peOffset + 6 -gt $bytes.Length -or
              $bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
            throw "installer-actions output has no valid PE header: $($dll.FullName)"
          }
          [uint16]$machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne $expectedMachine) {
            throw "installer-actions DLL machine is 0x$($machine.ToString('X4')); expected $expectedMachineName"
          }
          "FYAGENT_INSTALLER_ACTIONS_DLL=$($dll.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TAURI_FYAGENT_INSTALLER_ACTIONS_DLL=$($dll.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Import Windows Authenticode certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_AUTHENTICODE_PFX_BASE64: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_BASE64 }}
          WINDOWS_AUTHENTICODE_PFX_PASSWORD: ${{ secrets.WINDOWS_AUTHENTICODE_PFX_PASSWORD }}
          WINDOWS_AUTHENTICODE_PUBLISHER_SUBJECT: ${{ secrets.WINDOWS_AUTHENTICODE_PUBLISHER_SUBJECT }}
          WINDOWS_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.WINDOWS_AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'WINDOWS_AUTHENTICODE_PFX_BASE64',
            'WINDOWS_AUTHENTICODE_PFX_PASSWORD',
            'WINDOWS_AUTHENTICODE_PUBLISHER_SUBJECT',
            'WINDOWS_AUTHENTICODE_TIMESTAMP_URL'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required Windows Authenticode signing input is missing: $name"
            }
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'fyagent-authenticode-signing.pfx'
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_AUTHENTICODE_PFX_BASE64)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_AUTHENTICODE_PFX_PASSWORD `
            -AsPlainText `
            -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if ($null -eq $certificate -or -not $certificate.HasPrivateKey) {
            throw 'The Windows Authenticode certificate has no usable private key'
          }

          "FYAGENT_WINDOWS_CERT_THUMBPRINT=$($certificate.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_CERT_PUBLISHER_SUBJECT=$env:WINDOWS_AUTHENTICODE_PUBLISHER_SUBJECT" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FYAGENT_WINDOWS_CERT_PATH=$pfxPath" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign and verify Windows application executable
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
          WINDOWS_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.WINDOWS_AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $exePath = Join-Path $targetRoot 'fyagent.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Windows release executable not found: $exePath"
          }

          & signtool.exe sign `
            /fd SHA256 `
            /tr $env:WINDOWS_AUTHENTICODE_TIMESTAMP_URL `
            /td SHA256 `
            /sha1 $env:FYAGENT_WINDOWS_CERT_THUMBPRINT `
            /v `
            $exePath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for $exePath"
          }
          & signtool.exe verify /pa /all /v $exePath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed for $exePath"
          }

          $signature = Get-AuthenticodeSignature -FilePath $exePath
          if ($signature.Status -ne 'Valid' -or
              $null -eq $signature.SignerCertificate -or
              $null -eq $signature.TimeStamperCertificate) {
            throw "Executable must have a valid Authenticode signer and timestamp: $exePath"
          }
          if ($signature.SignerCertificate.Subject -ne $env:FYAGENT_WINDOWS_CERT_PUBLISHER_SUBJECT) {
            throw "Executable signer does not match the expected publisher subject: $exePath"
          }

      - name: Bundle signed Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
          FYAGENT_WINDOWS_MANIFEST: release
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            pnpm tauri bundle --target aarch64-pc-windows-msvc --bundles msi
          } else {
            pnpm tauri bundle --bundles msi
          }

      - name: Re-verify embedded Windows release manifest after MSI bundle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $exePath = Join-Path $targetRoot 'fyagent.exe'
          if (-not (Test-Path -LiteralPath $exePath -PathType Leaf)) {
            throw "Windows release executable not found after MSI bundle: $exePath"
          }

          $manifestPath = Join-Path $env:RUNNER_TEMP 'fyagent-release-after-msi-bundle.manifest'
          Remove-Item -LiteralPath $manifestPath -Force -ErrorAction SilentlyContinue
          Get-Command mt.exe -ErrorAction Stop | Out-Null
          # Re-read the same signed release EXE; never install the MSI to inspect it.
          & mt.exe "-inputresource:$exePath;#1" "-out:$manifestPath" -nologo
          if ($LASTEXITCODE -ne 0) {
            throw "mt.exe failed to extract RT_MANIFEST from $exePath after MSI bundle"
          }
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw "mt.exe did not write the extracted RT_MANIFEST: $manifestPath"
          }

          $manifest = [System.Xml.XmlDocument]::new()
          try {
            $manifest.Load($manifestPath)
          } catch {
            throw "Extracted RT_MANIFEST is not valid XML: $($_.Exception.Message)"
          }
          $requestedExecutionLevels = @(
            $manifest.SelectNodes("//*[local-name()='requestedExecutionLevel']")
          )
          if ($requestedExecutionLevels.Count -ne 1) {
            throw "Embedded RT_MANIFEST must contain exactly one requestedExecutionLevel; found $($requestedExecutionLevels.Count)"
          }
          [System.Xml.XmlElement]$requestedExecutionLevel = $requestedExecutionLevels[0]
          if (
            $requestedExecutionLevel.NamespaceURI -cne 'urn:schemas-microsoft-com:asm.v3' -or
            $requestedExecutionLevel.Attributes.Count -ne 2 -or
            -not $requestedExecutionLevel.HasAttribute('level') -or
            -not $requestedExecutionLevel.HasAttribute('uiAccess') -or
            $requestedExecutionLevel.GetAttribute('level') -cne 'requireAdministrator' -or
            $requestedExecutionLevel.GetAttribute('uiAccess') -cne 'false'
          ) {
            throw 'Embedded RT_MANIFEST must contain exactly one requestedExecutionLevel level="requireAdministrator" uiAccess="false"'
          }

      - name: Verify Windows MSI native directory validator structure
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $msis = @(
            Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Filter *.msi -File -ErrorAction Stop
          )
          if ($msis.Count -ne 1) {
            throw "Expected exactly one Windows MSI to inspect, found $($msis.Count)"
          }

          $installer = New-Object -ComObject WindowsInstaller.Installer
          $database = $installer.OpenDatabase($msis[0].FullName, 0)
          function Get-MsiRecord([string]$query) {
            $view = $database.OpenView($query)
            $view.Execute()
            return $view.Fetch()
          }
          function Get-MsiRecords([string]$query) {
            $view = $database.OpenView($query)
            $view.Execute()
            while ($record = $view.Fetch()) {
              $record
            }
          }
          function Require-MsiRecord([string]$query, [string]$description) {
            if ($null -eq (Get-MsiRecord $query)) {
              throw "MSI contract is missing: $description"
            }
          }
          function Get-MsiSequenceRow([string]$table, [string]$action) {
            $record = Get-MsiRecord "SELECT ``Condition``, ``Sequence`` FROM ``$table`` WHERE ``Action``='$action'"
            if ($null -eq $record) {
              throw "MSI contract is missing sequence action $action in $table"
            }
            return [PSCustomObject]@{
              Action = $action
              Condition = [string]$record.StringData(1)
              Sequence = [int]$record.IntegerData(2)
            }
          }
          function Assert-MsiSequenceCondition([string]$table, [string]$action, [string]$expectedCondition) {
            $row = Get-MsiSequenceRow $table $action
            if ($row.Condition -cne $expectedCondition) {
              throw "MSI $table condition drifted for $action: '$($row.Condition)'"
            }
            return $row
          }
          function Assert-MsiSequenceBefore($earlier, $later, [string]$description) {
            if ($earlier.Sequence -ge $later.Sequence) {
              throw "MSI sequence order failed: $description ($($earlier.Sequence) >= $($later.Sequence))"
            }
          }
          function Assert-MsiCustomAction([string]$action, [int]$expectedType, [string]$expectedSource, [string]$expectedTarget) {
            $record = Get-MsiRecord "SELECT ``Type``, ``Source``, ``Target`` FROM ``CustomAction`` WHERE ``Action``='$action'"
            if ($null -eq $record -or $record.IntegerData(1) -ne $expectedType -or
                [string]$record.StringData(2) -cne $expectedSource -or
                [string]$record.StringData(3) -cne $expectedTarget) {
              throw "MSI custom action contract drifted for $action"
            }
            return $record
          }

          Require-MsiRecord 'SELECT `Name` FROM `Binary` WHERE `Name`=''FyAgentInstallerActions''' 'architecture-matched installer-actions Binary row'
          if ($null -ne (Get-MsiRecord 'SELECT `File` FROM `File` WHERE `FileName` LIKE ''%fyagent_installer_actions.dll%''')) {
            throw 'MSI must not install the custom-action DLL as an application payload'
          }
          $productVersion = Get-MsiRecord 'SELECT `Value` FROM `Property` WHERE `Property`=''ProductVersion'''
          if ($null -eq $productVersion -or $productVersion.StringData(1) -ne $env:APP_VERSION) {
            throw "MSI ProductVersion does not match frozen APP_VERSION $env:APP_VERSION"
          }
          $uiAction = Get-MsiRecord 'SELECT `Type`, `Source`, `Target` FROM `CustomAction` WHERE `Action`=''ValidateFyAgentInstallDirUi'''
          if ($null -eq $uiAction -or $uiAction.IntegerData(1) -ne 1 -or
              $uiAction.StringData(2) -ne 'FyAgentInstallerActions' -or
              $uiAction.StringData(3) -ne 'ValidateFyAgentInstallDirUi') {
            throw 'MSI UI directory action is not the expected Type 1 DLL entry'
          }
          $executeAction = Get-MsiRecord 'SELECT `Type`, `Source`, `Target` FROM `CustomAction` WHERE `Action`=''ValidateFyAgentInstallDirExecute'''
          if ($null -eq $executeAction -or $executeAction.IntegerData(1) -ne 1 -or
              $executeAction.StringData(2) -ne 'FyAgentInstallerActions' -or
              $executeAction.StringData(3) -ne 'ValidateFyAgentInstallDirExecute') {
            throw 'MSI execute directory action is not the expected Type 1 DLL entry'
          }
          Assert-MsiCustomAction 'ClearFyAgentPreviousInstallDir' 307 'FYAGENT_PREVIOUS_INSTALLDIR' ''
          Assert-MsiCustomAction 'ClearMaintenanceInstallDir' 307 'INSTALLDIR' ''
          Assert-MsiCustomAction 'RestoreInstallDirFromPrevious' 51 'INSTALLDIR' '[FYAGENT_PREVIOUS_INSTALLDIR]'
          Assert-MsiCustomAction 'AbortUnsafeFyAgentInstallDir' 19 '' '[FYAGENT_INSTALLDIR_ERROR_MESSAGE]'
          $missingAnchorAction = Get-MsiRecord 'SELECT `Type` FROM `CustomAction` WHERE `Action`=''AbortUntrustedFyAgentMaintenance'''
          if ($null -eq $missingAnchorAction -or $missingAnchorAction.IntegerData(1) -ne 19) {
            throw 'MSI missing-InstallDir-anchor action is not Type 19'
          }
          Require-MsiRecord 'SELECT `Property` FROM `AppSearch` WHERE `Property`=''FYAGENT_PREVIOUS_INSTALLDIR'' AND `Signature_`=''FyAgentPreviousInstallDir''' 'HKLM InstallDir AppSearch contract'
          Require-MsiRecord 'SELECT `Signature_` FROM `RegLocator` WHERE `Signature_`=''FyAgentPreviousInstallDir'' AND `Root`=2 AND `Key`=''Software\fyagent\FyAgent'' AND `Name`=''InstallDir'' AND `Type`=18' 'HKLM InstallDir registry locator'
          $installDirLock = Get-MsiRecord 'SELECT `SDDLText` FROM `MsiLockPermissionsEx` WHERE `LockObject`=''INSTALLDIR'''
          if ($null -eq $installDirLock -or
              $installDirLock.StringData(1) -cne 'O:SYD:P(A;OICI;0x1200a9;;;BU)(A;OICI;FA;;;BA)(A;OICI;FA;;;SY)') {
            throw 'MSI INSTALLDIR protected DACL contract drifted'
          }

          # The pure-uninstall predicate in WiX must name every rendered
          # component rooted at INSTALLDIR. Recompute the directory closure
          # from the MSI tables so a template addition cannot make a mixed
          # remove/add transaction skip admission.
          $directoryParents = @{}
          foreach ($row in @(Get-MsiRecords 'SELECT `Directory`, `Directory_Parent` FROM `Directory`')) {
            $directoryParents[[string]$row.StringData(1)] = [string]$row.StringData(2)
          }
          function Test-InstallDirDescendant([string]$directory) {
            $visited = @{}
            while (-not [string]::IsNullOrWhiteSpace($directory) -and -not $visited.ContainsKey($directory)) {
              if ($directory -eq 'INSTALLDIR') {
                return $true
              }
              $visited[$directory] = $true
              if (-not $directoryParents.ContainsKey($directory)) {
                return $false
              }
              $directory = $directoryParents[$directory]
            }
            return $false
          }
          $expectedInstallDirComponents = @(
            'CMP_UninstallShortcut',
            'InstallDirectoryAcl',
            'Path',
            'RegistryEntries'
          )
          $actualInstallDirComponents = @(
            foreach ($row in @(Get-MsiRecords 'SELECT `Component`, `Directory_` FROM `Component`')) {
              if (Test-InstallDirDescendant ([string]$row.StringData(2))) {
                [string]$row.StringData(1)
              }
            }
          ) | Sort-Object
          $componentDifference = @(
            Compare-Object -ReferenceObject $expectedInstallDirComponents -DifferenceObject $actualInstallDirComponents
          )
          if ($componentDifference.Count -ne 0) {
            throw "MSI INSTALLDIR component guard drifted: $($componentDifference | Out-String)"
          }

          $maintenanceCondition = 'Installed OR WIX_UPGRADE_DETECTED OR UPGRADINGPRODUCTCODE'
          $pureUninstallCondition = '$CMP_UninstallShortcut = 2 AND $InstallDirectoryAcl = 2 AND $Path = 2 AND $RegistryEntries = 2'
          $missingAnchorCondition = "(Installed OR WIX_UPGRADE_DETECTED OR UPGRADINGPRODUCTCODE) AND NOT FYAGENT_PREVIOUS_INSTALLDIR AND NOT ($pureUninstallCondition)"
          $restoreDirectoryCondition = '(Installed OR WIX_UPGRADE_DETECTED OR UPGRADINGPRODUCTCODE) AND FYAGENT_PREVIOUS_INSTALLDIR'
          $activeDirectoryCondition = "NOT ($pureUninstallCondition)"
          $allowedDirectoryCondition = "$activeDirectoryCondition AND FYAGENT_INSTALLDIR_VALID = \"1\""
          $rejectedDirectoryCondition = "$activeDirectoryCondition AND FYAGENT_INSTALLDIR_VALID <> \"1\""
          foreach ($table in @('InstallUISequence', 'InstallExecuteSequence')) {
            $clearAnchor = Assert-MsiSequenceCondition $table 'ClearFyAgentPreviousInstallDir' $maintenanceCondition
            $clearInstallDir = Assert-MsiSequenceCondition $table 'ClearMaintenanceInstallDir' $maintenanceCondition
            $missingAnchor = Assert-MsiSequenceCondition $table 'AbortUntrustedFyAgentMaintenance' $missingAnchorCondition
            $restoreInstallDir = Assert-MsiSequenceCondition $table 'RestoreInstallDirFromPrevious' $restoreDirectoryCondition
            $appSearch = Get-MsiSequenceRow $table 'AppSearch'
            $costFinalize = Get-MsiSequenceRow $table 'CostFinalize'
            Assert-MsiSequenceBefore $clearAnchor $appSearch "$table clear anchor before AppSearch"
            Assert-MsiSequenceBefore $clearInstallDir $appSearch "$table clear INSTALLDIR before AppSearch"
            Assert-MsiSequenceBefore $appSearch $restoreInstallDir "$table AppSearch before InstallDir restore"
            Assert-MsiSequenceBefore $restoreInstallDir $costFinalize "$table InstallDir restore before CostFinalize"
            Assert-MsiSequenceBefore $costFinalize $missingAnchor "$table CostFinalize before missing-anchor abort"
            if ($table -eq 'InstallUISequence') {
              $validator = Assert-MsiSequenceCondition $table 'ValidateFyAgentInstallDirUi' $activeDirectoryCondition
            } else {
              $validator = Assert-MsiSequenceCondition $table 'ValidateFyAgentInstallDirExecute' $activeDirectoryCondition
            }
            $apply = Assert-MsiSequenceCondition $table 'ApplyValidatedFyAgentInstallDir' $allowedDirectoryCondition
            Assert-MsiSequenceBefore $missingAnchor $validator "$table missing-anchor abort before validator"
            Assert-MsiSequenceBefore $validator $apply "$table validator before normalized-directory apply"
            if ($table -eq 'InstallExecuteSequence') {
              $reject = Assert-MsiSequenceCondition $table 'AbortUnsafeFyAgentInstallDir' $rejectedDirectoryCondition
              $installValidate = Get-MsiSequenceRow $table 'InstallValidate'
              $installFiles = Get-MsiSequenceRow $table 'InstallFiles'
              Assert-MsiSequenceBefore $apply $reject "$table normalized-directory apply before unsafe-directory abort"
              Assert-MsiSequenceBefore $reject $installValidate "$table unsafe-directory abort before InstallValidate"
              Assert-MsiSequenceBefore $installValidate $installFiles "$table InstallValidate before InstallFiles"
            }
          }
          Require-MsiRecord 'SELECT `Dialog` FROM `Dialog` WHERE `Dialog`=''FyAgentUnsafeInstallDirDlg''' 'unsafe-directory dialog'
          Require-MsiRecord 'SELECT `Event` FROM `ControlEvent` WHERE `Dialog_`=''InstallDirDlg'' AND `Control_`=''Next'' AND `Event`=''DoAction'' AND `Argument`=''ValidateFyAgentInstallDirUi''' 'InstallDir Next native validator event'
          Require-MsiRecord 'SELECT `Event` FROM `ControlEvent` WHERE `Dialog_`=''InstallDirDlg'' AND `Control_`=''Next'' AND `Event`=''SpawnDialog'' AND `Argument`=''FyAgentUnsafeInstallDirDlg''' 'InstallDir unsafe-directory dialog event'
          if ($null -ne (Get-MsiRecord 'SELECT `Action` FROM `CustomAction` WHERE `Action`=''ValidateInstallDirectory''')) {
            throw 'MSI still contains the legacy scripted directory action'
          }

          $template = [string]$database.SummaryInformation(0).Property(7)
          $expectedArchitecture = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') { 'arm64' } else { 'x64' }
          if ($template -notmatch "(?i)$expectedArchitecture") {
            throw "MSI summary template does not match $expectedArchitecture: $template"
          }

      - name: Sign and verify Windows MSI
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
          WINDOWS_AUTHENTICODE_TIMESTAMP_URL: ${{ secrets.WINDOWS_AUTHENTICODE_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $targetRoot = if ($env:WINDOWS_RELEASE_ARCH -eq 'arm64') {
            'src-tauri/target/aarch64-pc-windows-msvc/release'
          } else {
            'src-tauri/target/release'
          }
          $msis = @(
            Get-ChildItem `
              -Path (Join-Path $targetRoot 'bundle/msi') `
              -Recurse `
              -Filter *.msi `
              -File `
              -ErrorAction Stop
          )
          if ($msis.Count -ne 1) {
            throw "Expected exactly one Windows MSI to sign, found $($msis.Count)"
          }
          $msiPath = $msis[0].FullName

          & signtool.exe sign `
            /fd SHA256 `
            /tr $env:WINDOWS_AUTHENTICODE_TIMESTAMP_URL `
            /td SHA256 `
            /sha1 $env:FYAGENT_WINDOWS_CERT_THUMBPRINT `
            /v `
            $msiPath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode signing failed for $msiPath"
          }
          & signtool.exe verify /pa /all /v $msiPath
          if ($LASTEXITCODE -ne 0) {
            throw "Authenticode verification failed for $msiPath"
          }

          $signature = Get-AuthenticodeSignature -FilePath $msiPath
          if ($signature.Status -ne 'Valid' -or
              $null -eq $signature.SignerCertificate -or
              $null -eq $signature.TimeStamperCertificate) {
            throw "MSI must have a valid Authenticode signer and timestamp: $msiPath"
          }
          if ($signature.SignerCertificate.Subject -ne $env:FYAGENT_WINDOWS_CERT_PUBLISHER_SUBJECT) {
            throw "MSI signer does not match the expected publisher subject: $msiPath"
          }

      - name: Build Tauri App (Linux)
        if: runner.os == 'Linux'
        run: pnpm tauri build --bundles appimage,deb,rpm

      - name: Verify Linux bundle metadata uses frozen application version
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          APPIMAGE="$(find src-tauri/target/release/bundle -name '*.AppImage' -type f | head -1 || true)"
          DEB="$(find src-tauri/target/release/bundle -name '*.deb' -type f | head -1 || true)"
          RPM="$(find src-tauri/target/release/bundle -name '*.rpm' -type f | head -1 || true)"
          [ -n "$APPIMAGE" ] && [ -n "$DEB" ] && [ -n "$RPM" ] || {
            echo "Expected AppImage, DEB, and RPM bundle outputs" >&2
            exit 1
          }
          case "$(basename "$APPIMAGE")" in
            *"$APP_VERSION"*) ;;
            *) echo "AppImage filename does not contain APP_VERSION $APP_VERSION" >&2; exit 1 ;;
          esac
          DEB_VERSION="$(dpkg-deb -f "$DEB" Version)"
          case "$DEB_VERSION" in
            "$APP_VERSION"|"$APP_VERSION"-*|"$APP_VERSION"+*) ;;
            *) echo "DEB version $DEB_VERSION does not contain APP_VERSION $APP_VERSION" >&2; exit 1 ;;
          esac
          RPM_VERSION="$(rpm -qp --qf '%{VERSION}' "$RPM")"
          [ "$RPM_VERSION" = "$APP_VERSION" ] || {
            echo "RPM version $RPM_VERSION does not match APP_VERSION $APP_VERSION" >&2
            exit 1
          }

      - name: Prepare macOS Assets
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$APP_VERSION"
          [ "$RELEASE_TAG" = "v$VERSION" ] || {
            echo "Frozen release tag does not match the application version" >&2
            exit 1
          }

          # Locate bundle artifacts
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found" >&2
            exit 1
          fi

          # Staple notarization ticket to .app (Tauri already notarized it)
          xcrun stapler staple "$APP_PATH"
          echo "✅ .app stapled"

          # Collect the signed app as a normal user-downloadable ZIP. V1 has
          # no in-app automatic-update artifact or signature sidecar.
          NEW_ZIP="FyAgent-${VERSION}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"
          echo "macOS zip ready: $NEW_ZIP"

          # Create a styled DMG with create-dmg (Tauri's built-in DMG styling doesn't work on CI)
          if [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "❌ APPLE_SIGNING_IDENTITY is missing before DMG creation" >&2
            exit 1
          fi

          HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg
          NEW_DMG="FyAgent-${VERSION}-macOS.dmg"
          DMG_STAGE_DIR="$RUNNER_TEMP/dmg-stage"
          rm -rf "$DMG_STAGE_DIR"
          mkdir -p "$DMG_STAGE_DIR"
          ditto "$APP_PATH" "$DMG_STAGE_DIR/FyAgent.app"

          create-dmg \
            --volname "FyAgent" \
            --background "src-tauri/icons/dmg-background.png" \
            --window-size 660 400 \
            --window-pos 200 120 \
            --icon-size 80 \
            --icon "FyAgent.app" 180 220 \
            --hide-extension "FyAgent.app" \
            --app-drop-link 480 220 \
            --codesign "$APPLE_SIGNING_IDENTITY" \
            --no-internet-enable \
            "release-assets/$NEW_DMG" \
            "$DMG_STAGE_DIR"

          rm -rf "$DMG_STAGE_DIR"
          echo "✅ Styled DMG created: $NEW_DMG"

      - name: Prepare and verify unsigned macOS branch assets
        if: runner.os == 'macOS' && github.ref_type != 'tag'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          VERSION="$APP_VERSION"
          if [ -z "$VERSION" ]; then
            echo "Frozen application version is missing" >&2
            exit 1
          fi

          APP_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos \
            -maxdepth 1 -name "FyAgent.app" -type d | head -1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "No FyAgent.app found in the unsigned macOS bundle output" >&2
            exit 1
          fi

          NEW_ZIP="FyAgent-${VERSION}-macOS-unsigned.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release-assets/$NEW_ZIP"

          DMG_STAGE_DIR="$RUNNER_TEMP/unsigned-dmg-stage"
          MOUNT_POINT="$RUNNER_TEMP/unsigned-dmg-mount"
          rm -rf "$DMG_STAGE_DIR" "$MOUNT_POINT"
          mkdir -p "$DMG_STAGE_DIR" "$MOUNT_POINT"
          detach_required=false
          cleanup() {
            exit_code=$?
            trap - EXIT
            set +e
            if [ "$detach_required" = true ]; then
              hdiutil detach "$MOUNT_POINT"
              if [ "$?" -ne 0 ]; then
                echo "Failed to detach unsigned DMG from $MOUNT_POINT" >&2
                exit_code=1
              fi
            fi
            rm -rf "$DMG_STAGE_DIR" "$MOUNT_POINT"
            if [ "$?" -ne 0 ]; then
              echo "Failed to clean unsigned DMG temporary directories" >&2
              exit_code=1
            fi
            exit "$exit_code"
          }
          trap cleanup EXIT

          ditto "$APP_PATH" "$DMG_STAGE_DIR/FyAgent.app"

          NEW_DMG="FyAgent-${VERSION}-macOS-unsigned.dmg"
          DMG_PATH="release-assets/$NEW_DMG"
          hdiutil create -volname "FyAgent unsigned" -srcfolder "$DMG_STAGE_DIR" \
            -ov -format UDZO "$DMG_PATH"
          hdiutil verify "$DMG_PATH"

          detach_required=true
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -noautoopen -mountpoint "$MOUNT_POINT"
          if [ ! -d "$MOUNT_POINT/FyAgent.app" ]; then
            echo "Mounted unsigned DMG does not contain FyAgent.app" >&2
            exit 1
          fi
          echo "Unsigned DMG verified and mounted with FyAgent.app present; no signing, notarization, or Gatekeeper claim is made."

      - name: Notarize macOS DMG
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found in release-assets/ to notarize" >&2
            exit 1
          fi

          echo "=== Notarizing DMG: $DMG_PATH ==="
          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            echo "=== DMG notarization attempt ${attempt}/${max_attempts} ==="
            if xcrun notarytool submit "$DMG_PATH" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --wait; then
              echo "✅ DMG notarization succeeded"
              xcrun stapler staple "$DMG_PATH"
              echo "✅ DMG stapled"
              break
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "❌ DMG notarization failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep_seconds=$((attempt * 60))
            echo "⚠️ DMG notarization failed, retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
          done

      - name: Verify macOS code signing and notarization
        if: runner.os == 'macOS' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail

          # Verify .app (from Tauri bundle)
          APP_PATH=""
          for path in \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos" \
            "src-tauri/target/aarch64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/x86_64-apple-darwin/release/bundle/macos" \
            "src-tauri/target/release/bundle/macos"; do
            if [ -d "$path" ]; then
              [ -z "$APP_PATH" ] && APP_PATH=$(find "$path" -maxdepth 1 -name "*.app" -type d | head -1 || true)
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "❌ No .app found for verification" >&2
            exit 1
          fi
          echo "=== Verifying .app: $APP_PATH ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "✅ codesign verification passed"
          spctl -a -t exec -vv "$APP_PATH"
          echo "✅ spctl assessment passed"
          xcrun stapler validate "$APP_PATH"
          echo "✅ .app stapler validation passed"

          # Verify .dmg (from release-assets/, created by create-dmg + notarized)
          DMG_PATH=$(find release-assets -maxdepth 1 -name "*.dmg" -type f | head -1 || true)
          if [ -n "$DMG_PATH" ]; then
            echo "=== Verifying .dmg: $DMG_PATH ==="
            codesign --verify --verbose=2 "$DMG_PATH"
            echo "✅ .dmg codesign verification passed"
            spctl -a -t open --context context:primary-signature -vv "$DMG_PATH"
            echo "✅ .dmg spctl assessment passed"
            xcrun stapler validate "$DMG_PATH"
            echo "✅ .dmg stapler validation passed"
          else
            echo "❌ No .dmg found for verification — release would ship without verified DMG" >&2
            exit 1
          fi

      - name: Prepare Windows Assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_RELEASE_ARCH: ${{ matrix.arch || 'x86_64' }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:APP_VERSION
          if ([string]::IsNullOrWhiteSpace($VERSION)) {
            throw 'Frozen application version is missing'
          }
          $isArm64 = $env:WINDOWS_RELEASE_ARCH -eq 'arm64'
          $targetRoot = if ($isArm64) { 'src-tauri/target/aarch64-pc-windows-msvc/release' } else { 'src-tauri/target/release' }
          $assetSuffix = if ($isArm64) { '-arm64' } else { '' }

          # 仅打包 MSI 手动安装器。
          $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle/msi') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            # 兜底：全局搜索 .msi
            $msi = Get-ChildItem -Path (Join-Path $targetRoot 'bundle') -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "FyAgent-$VERSION-Windows$assetSuffix.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "Installer copied: $dest"
          } else {
            throw "No signed Windows MSI installer found for $env:WINDOWS_RELEASE_ARCH"
          }

      - name: Remove Windows Authenticode certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not [string]::IsNullOrWhiteSpace($env:FYAGENT_WINDOWS_CERT_THUMBPRINT)) {
            $certificatePath = "Cert:\CurrentUser\My\$env:FYAGENT_WINDOWS_CERT_THUMBPRINT"
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:FYAGENT_WINDOWS_CERT_PATH) -and
              (Test-Path -LiteralPath $env:FYAGENT_WINDOWS_CERT_PATH)) {
            Remove-Item -LiteralPath $env:FYAGENT_WINDOWS_CERT_PATH -Force
          }

      - name: Prepare Linux Assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="$APP_VERSION"
          [ -n "$VERSION" ] || { echo "Frozen application version is missing" >&2; exit 1; }
          ARCH="${{ matrix.arch || 'x86_64' }}"
          # 手动安装 AppImage。
          APPIMAGE=$(find src-tauri/target/release/bundle -name "*.AppImage" | head -1 || true)
          if [ -n "$APPIMAGE" ]; then
            NEW_APPIMAGE="FyAgent-${VERSION}-Linux-${ARCH}.AppImage"
            cp "$APPIMAGE" "release-assets/$NEW_APPIMAGE"
            echo "AppImage copied: $NEW_APPIMAGE"
          else
            echo "No AppImage found under target/release/bundle" >&2
          fi
          # 额外上传 .deb（用于手动安装）。
          DEB=$(find src-tauri/target/release/bundle -name "*.deb" | head -1 || true)
          if [ -n "$DEB" ]; then
            cp "$DEB" "release-assets/FyAgent-${VERSION}-Linux-${ARCH}.deb"
            echo "Deb package copied: FyAgent-${VERSION}-Linux-${ARCH}.deb"
          else
            echo "No .deb found (optional)"
          fi
          # 额外上传 .rpm（用于 Fedora/RHEL/openSUSE 等的手动安装）。
          RPM=$(find src-tauri/target/release/bundle -name "*.rpm" | head -1 || true)
          if [ -n "$RPM" ]; then
            cp "$RPM" "release-assets/FyAgent-${VERSION}-Linux-${ARCH}.rpm"
            echo "RPM package copied: FyAgent-${VERSION}-Linux-${ARCH}.rpm"
          else
            echo "No .rpm found (optional)"
          fi

      - name: List prepared assets
        shell: bash
        run: |
          ls -la release-assets || true

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ runner.os }}-${{ matrix.arch || runner.arch }}
          path: release-assets/*
          if-no-files-found: error

      - name: List generated bundles (debug)
        if: always()
        shell: bash
        run: |
          echo "Listing bundles in src-tauri/target..."
          find src-tauri/target -maxdepth 4 -type f -name "*.*" 2>/dev/null || true

      - name: Clean up Apple signing keychain
        if: runner.os == 'macOS' && always()
        shell: bash
        run: |
          if [ -n "${ORIGINAL_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIGINAL_DEFAULT_KEYCHAIN" || true
          fi
          if [ -f "$RUNNER_TEMP/build.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          fi

  publish-release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    needs: [version-contract, release]
    env:
      APP_VERSION: ${{ needs.version-contract.outputs.app_version }}
      RELEASE_TAG: ${{ needs.version-contract.outputs.release_tag }}
      SOURCE_SHA: ${{ needs.version-contract.outputs.source_sha }}
    permissions:
      contents: write
    steps:
      - name: Checkout manifest generator
        uses: actions/checkout@v6

      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Generate frozen download manifest
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-download-manifest.mjs \
            release-assets \
            "$APP_VERSION" \
            "$RELEASE_TAG" \
            "$SOURCE_SHA" \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            release-assets/download-manifest.json

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version-contract.outputs.release_tag }}
          name: FyAgent ${{ needs.version-contract.outputs.release_tag }}
          prerelease: true
          body: |
            ## FyAgent ${{ needs.version-contract.outputs.release_tag }}

            Claude Code 供应商切换工具

            Source SHA: `${{ needs.version-contract.outputs.source_sha }}`

            ### 下载

            - **macOS**: `FyAgent-${{ needs.version-contract.outputs.app_version }}-macOS.dmg`（推荐）或 `FyAgent-${{ needs.version-contract.outputs.app_version }}-macOS.zip`（解压即用）
            - **Windows (x86_64)**: `FyAgent-${{ needs.version-contract.outputs.app_version }}-Windows.msi`（签名安装版）
            - **Windows (ARM64)**: `FyAgent-${{ needs.version-contract.outputs.app_version }}-Windows-arm64.msi`（签名安装版）
            - **Linux (x86_64)**: `FyAgent-${{ needs.version-contract.outputs.app_version }}-Linux-x86_64.AppImage` / `.deb` / `.rpm`
            - **Linux (ARM64)**: `FyAgent-${{ needs.version-contract.outputs.app_version }}-Linux-arm64.AppImage` / `.deb` / `.rpm`

            ---
            macOS 版本已通过 Apple 代码签名和公证，可直接安装使用。
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
