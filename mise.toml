min_version = "2026.8.0"

[settings]
lockfile = true
task.run_auto_install = false
lockfile_platforms = [
  "linux-x64",
  "linux-arm64",
  "macos-x64",
  "macos-arm64",
  "windows-x64",
  "windows-arm64",
]

[tools]
node = "22.12.0"
pnpm = "10.12.3"
python = "3.12.8"
rust = { version = "1.95.0", profile = "minimal", components = ["rustfmt", "clippy"] }
